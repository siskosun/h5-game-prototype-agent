name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26.10.0"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Template integration
        run: python dev/check_templates.py
      - name: Runtime skill package
        run: python dev/build_skill_zip.py

  probe-browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26.10.0"
      - name: Install probe dependencies
        working-directory: templates/probe
        run: npm ci
      - name: Install Chromium
        working-directory: templates/probe
        run: npx playwright install --with-deps chromium
      - name: Probe E2E and known-bad fixtures
        run: python dev/check_probe_e2e.py
      - name: Stage and verify probe evidence
        if: always()
        run: python dev/stage_probe_evidence.py
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: probe-evidence-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          path: artifacts/probe-evidence/
